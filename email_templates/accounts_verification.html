<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>Verify Your Email</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="width: 100% !important; height: 100% !important; margin: 0 !important; padding: 0 !important; font-family: 'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f8f7f9; color: #1a1a1a;">
  <div style="max-width: 600px; margin: 0 auto; padding: 24px;">
    <div style="background: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12); border: 1px solid rgba(0, 0, 0, 0.08);">
      
      <div style="font-size: 24px; font-weight: 700; color: #73197a; margin-bottom: 24px; text-align: center;">
        Hexlink
      </div>
      
      <h1 style="font-size: 22px; font-weight: 600; line-height: 30px; margin-top: 0; margin-bottom: 16px; color: #1a1a1a; text-align: center;">
        Confirm your email address
      </h1>
      
      <p style="font-size: 16px; line-height: 24px; margin-bottom: 24px; color: #6b6b7a; text-align: center;">
        Thank you for signing up! Please use the verification code below to complete your registration. This code will expire shortly.
      </p>
      
      <div style="background-color: #f8f7f9; border-radius: 6px; padding: 16px; text-align: center; margin-bottom: 24px; border: 1px solid rgba(115, 25, 122, 0.1);">
        <span style="font-size: 32px; font-weight: 700; color: #7A0081; letter-spacing: 4px; font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New', monospace;">
          {####}
        </span>
      </div>
      
      <p style="font-size: 14px; line-height: 20px; color: #6b6b7a; margin-bottom: 0; text-align: center;">
        If you didn't request this email, you can safely ignore it.
      </p>
    </div>
  </div>
</body>
</html>
