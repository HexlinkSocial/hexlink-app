AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hexlink Serverless Compute Layer (SAM)

Parameters:
  ProjectName:
    Type: String
    Default: hexlink
  SupabaseDatabaseUrl:
    Type: String
    NoEcho: true
  AllowedOriginsUrl:
    Type: String
  CognitoUserPoolId:
    Type: String
    NoEcho: true
  CognitoClientId:
    Type: String
    NoEcho: true

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DATABASE_URL: !Ref SupabaseDatabaseUrl
        NODE_ENV: production
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref CognitoClientId

Resources:

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "${ProjectName}-api"
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${AllowedOriginsUrl}"
          - "http://localhost:3000"
          - "http://localhost:5173"
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type, authorization]
        MaxAge: 86400

  GetCommunitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-getCommunitiesByCellId"
      CodeUri: dist/
      Handler: getCommunitiesByCellId.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /CommunitiesByCellId
            Method: GET

  GetCommunityCountsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-getCommunityCounts"
      CodeUri: dist/
      Handler: getCommunityCounts.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /CommunityCounts
            Method: GET

  CreateCommunityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-createCommunity"
      CodeUri: dist/
      Handler: createCommunity.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /CreateCommunity
            Method: POST

  ApproveOrDenyCommunityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-approveOrDenyCommunity"
      CodeUri: dist/
      Handler: approveOrDenyCommunity.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ApproveOrDenyCommunity
            Method: POST

  GetPendingCommunitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-getPendingCommunities"
      CodeUri: dist/
      Handler: getPendingCommunities.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /GetPendingCommunities
            Method: POST

  GetUserCommunitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-getUserCommunities"
      CodeUri: dist/
      Handler: getUserCommunities.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /GetUserCommunities
            Method: POST

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"