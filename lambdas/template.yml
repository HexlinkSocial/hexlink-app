AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hexlink Serverless Compute Layer (SAM)

Parameters:
  ProjectName:
    Type: String
    Default: hexlink
  SupabaseDatabaseUrl:
    Type: String
    NoEcho: true
  AllowedOriginsUrl:
    Type: String
  CognitoUserPoolId:
    Type: String
    NoEcho: true
  CognitoClientId:
    Type: String
    NoEcho: true
  SesFromAddress:
    Type: String
  FrontendUrl:
    Type: String
  TurnstileSecretKey:
    Type: String
    NoEcho: true

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DATABASE_URL: !Ref SupabaseDatabaseUrl
        NODE_ENV: production
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref CognitoClientId
        SES_FROM_ADDRESS: !Ref SesFromAddress
        FRONTEND_URL: !Ref FrontendUrl
        DB_CA_CERT_PARAM: "db-ca-cert-1"
        SEND_EMAILS: "true"
        TURNSTILE_SECRET_KEY: !Ref TurnstileSecretKey

Resources:

  HttpApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/apigateway/${AWS::StackName}-access-logs"
      RetentionInDays: 30

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "${ProjectName}-api"
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId", "ip":"$context.identity.sourceIp", "requestTime":"$context.requestTime", "httpMethod":"$context.httpMethod", "routeKey":"$context.routeKey", "status":"$context.status", "protocol":"$context.protocol", "responseLength":"$context.responseLength", "integrationErrorMessage":"$context.integrationErrorMessage"}'
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${AllowedOriginsUrl}"
          - "http://localhost:3000"
          - "http://localhost:5173"
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type, authorization, x-captcha-token]
        MaxAge: 86400

  SesPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-ses-send"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: "*"

  SsmDbCertPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-ssm-db-cert-read"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/db-ca-cert-*"

  CognitoPreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-cognitoPreSignUp"
      CodeUri: dist/
      Handler: cognitoPreSignUp.handler
      Policies: []

  CognitoPreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CognitoPreSignUpFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"

  GetCommunitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-getCommunitiesByCellId"
      CodeUri: dist/
      Handler: getCommunitiesByCellId.handler
      Policies:
        - !Ref SsmDbCertPolicy
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /CommunitiesByCellId
            Method: GET

  GetCommunityCountsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-getCommunityCounts"
      CodeUri: dist/
      Handler: getCommunityCounts.handler
      Policies:
        - !Ref SsmDbCertPolicy
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /CommunityCounts
            Method: GET

  CreateCommunityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-createCommunity"
      CodeUri: dist/
      Handler: createCommunity.handler
      Policies:
        - !Ref SesPolicy
        - !Ref SsmDbCertPolicy
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /CreateCommunity
            Method: POST

  ApproveOrDenyCommunityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-approveOrDenyCommunity"
      CodeUri: dist/
      Handler: approveOrDenyCommunity.handler
      Policies:
        - !Ref SesPolicy
        - !Ref SsmDbCertPolicy
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ApproveOrDenyCommunity
            Method: POST

  GetPendingCommunitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-getPendingCommunities"
      CodeUri: dist/
      Handler: getPendingCommunities.handler
      Policies:
        - !Ref SsmDbCertPolicy
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /GetPendingCommunities
            Method: POST

  GetUserCommunitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-getUserCommunities"
      CodeUri: dist/
      Handler: getUserCommunities.handler
      Policies:
        - !Ref SsmDbCertPolicy
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /GetUserCommunities
            Method: GET

  EditCommunityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-editCommunity"
      CodeUri: dist/
      Handler: editCommunity.handler
      Policies:
        - !Ref SesPolicy
        - !Ref SsmDbCertPolicy
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /EditCommunity
            Method: POST

  DeleteCommunityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-deleteCommunity"
      CodeUri: dist/
      Handler: deleteCommunity.handler
      Policies:
        - !Ref SesPolicy
        - !Ref SsmDbCertPolicy
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /DeleteCommunity
            Method: POST

  LogFrontendErrorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-logFrontendError"
      CodeUri: dist/
      Handler: logFrontendError.handler
      Policies: []
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /LogFrontendError
            Method: POST

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  PreSignUpLambdaArn:
    Value: !GetAtt CognitoPreSignUpFunction.Arn