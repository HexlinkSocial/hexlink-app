version: "3.9"

services:
  db:
    image: postgres:15
    container_name: hexlink_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hexlink
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: hexlink_devcontainer
    volumes:
      - ..:/workspace:delegated 
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hexlink
      NODE_ENV: development
    depends_on:
      - db
    command: sleep infinity

volumes:
  db_data: