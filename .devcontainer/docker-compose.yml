version: "3.9"

services:
  db:
    image: postgres:15
    container_name: hexlink_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hexlink
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - sam-app-network

  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: hexlink_devcontainer
    volumes:
      - ..:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: postgresql://postgres:postgres@hexlink_postgres:5432/hexlink
      NODE_ENV: development
    depends_on:
      - db
    command: sleep infinity
    networks:
      - sam-app-network

networks:
  sam-app-network:
    name: sam-app-network
    driver: bridge

volumes:
  db_data: