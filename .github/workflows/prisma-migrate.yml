name: Run Prisma Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Supabase login via secret key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DB_SECRET_KEY }}
        run: echo "Authenticated to Supabase"

      - name: Connect to Supabase DB
        run: supabase db connect --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} &

      - name: Wait for tunnel
        run: sleep 5

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgres://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@localhost:5432/postgres?sslmode=require

      - name: Run Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgres://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@localhost:5432/postgres?sslmode=require