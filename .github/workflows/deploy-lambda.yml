name: Deploy Backend Lambdas

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lambdas/**/*.ts'
      - 'database/**/*.ts'

jobs:
  deploy_lambdas:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: eu-west-2
      LAMBDA_S3_BUCKET: ${{ secrets.AWS_LAMBDA_S3_BUCKET_NAME }}

    defaults:
      run:
        working-directory: lambdas

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: lambdas/package-lock.json

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Install Dependencies
        run: npm ci

      - name: Bundle TypeScript with esbuild
        run: npm run build

      - name: SAM Build
        run: sam build --template template.yml

      - name: SAM Deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name ${{ secrets.PROJECT_NAME }}-backend-stack \
            --s3-bucket $LAMBDA_S3_BUCKET \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --region ${{ env.AWS_REGION }} \
            --parameter-overrides \
              SupabaseDatabaseUrl="${{ secrets.DATABASE_URL }}" \
              AllowedOriginsUrl="${{ secrets.ALLOWED_ORIGINS_URL }}"