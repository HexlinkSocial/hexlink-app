name: Deploy Backend Lambdas

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lambdas/**/*.ts'
      - 'database/**/*.ts'

jobs:
  deploy_lambdas:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: eu-west-2
      LAMBDA_S3_BUCKET: ${{ secrets.AWS_LAMBDA_S3_BUCKET_NAME }}

    defaults:
      run:
        working-directory: lambdas

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            lambdas/package-lock.json
            database/package-lock.json

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Origin Verify Secret from SSM
        run: |
          SECRET=$(aws ssm get-parameter \
            --name "/${{ secrets.PROJECT_NAME }}/origin-verify-secret" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)
          echo "::add-mask::$SECRET"
          echo "ORIGIN_VERIFY_SECRET=$SECRET" >> "$GITHUB_ENV"

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Install Database Dependencies
        working-directory: database
        run: npm ci

      - name: Install Lambda Dependencies
        working-directory: lambdas
        run: npm ci

      - name: Run Tests
        working-directory: lambdas
        run: npm run test

      - name: Compile Email Templates
        working-directory: lambdas
        run: npm run build:emails

      - name: Bundle TypeScript with esbuild
        working-directory: lambdas
        run: npm run build

      - name: SAM Build
        working-directory: lambdas
        run: sam build --template template.yml

      - name: SAM Deploy
        working-directory: lambdas
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name ${{ secrets.PROJECT_NAME }}-backend-stack \
            --s3-bucket $LAMBDA_S3_BUCKET \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }} \
            --parameter-overrides \
              SupabaseDatabaseUrl="${{ secrets.DATABASE_URL }}" \
              AllowedOriginsUrl="${{ secrets.ALLOWED_ORIGINS_URL }}" \
              CognitoUserPoolId="${{ secrets.COGNITO_POOL }}" \
              CognitoClientId="${{ secrets.COGNITO_CLIENT }}" \
              FrontendUrl="${{ secrets.FRONTEND_URL }}" \
              SesFromAddress="${{ secrets.SES_FROM_ADDRESS }}" \
              TurnstileSecretKey="${{ secrets.TURNSTILE_SECRET_KEY }}" \
              OriginVerifySecret="${{ env.ORIGIN_VERIFY_SECRET }}"