name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/style.json'

jobs:
  deploy_frontend:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: eu-west-2
      FRONTEND_S3_BUCKET: ${{ secrets.AWS_BUCKET_NAME }}
      CLOUDFRONT_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Install frontend dependencies
        run: npm install

      - name: Build React App
        run: npm run build
        env:
          VITE_ACTIVE_TILE_FILE_LOCATION: /resources/uk_res8_hex_ids.zip
          VITE_ACTIVE_TILE_FILE: uk_res8_hex_ids.txt
          VITE_BACKEND_URL: ${{ secrets.BACKEND_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_POOL }}
          VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.COGNITO_CLIENT }}

      - name: Deploy frontend to S3
        run: aws s3 sync dist/ s3://$FRONTEND_S3_BUCKET --delete --exclude "resources/*" --quiet

      - name: Deploy public/style.json to S3 (if changed)
        run: aws s3 cp public/style.json s3://$FRONTEND_S3_BUCKET/style.json

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_ID \
            --paths "/*"