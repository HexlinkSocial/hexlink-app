name: Deploy Code Changes

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: eu-west-2
      FRONTEND_S3_BUCKET: ${{ secrets.AWS_BUCKET_NAME }}
      LAMBDA_S3_BUCKET: ${{ secrets.AWS_LAMBDA_S3_BUCKET_NAME }}
      CLOUDFRONT_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
      LAMBDA_NAME: ${{ secrets.AWS_LAMBDA_NAME }}

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: eu-west-2

    - name: Install frontend dependencies
      run: npm install

    - name: Build React App
      run: npm run build
      env:
        VITE_ACTIVE_TILE_FILE_LOCATION: /resources/uk_res8_hex_ids.zip
        VITE_ACTIVE_TILE_FILE: uk_res8_hex_ids.txt
        VITE_BACKEND_URL: ${{ secrets.BACKEND_URL }}
        VITE_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_POOL }}
        VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.COGNITO_CLIENT }}

    - name: Deploy frontend to S3
      run: |
        aws s3 sync dist/ s3://$FRONTEND_S3_BUCKET --delete --exclude "resources/*" --quiet

    - name: Invalidate CloudFront
      run: |
        aws cloudfront create-invalidation \
          --distribution-id $CLOUDFRONT_ID \
          --paths "/*"

    - name: Install backend dependencies
      run: npm ci --production
      working-directory: backend

    - name: Generate Prisma client
      run: npx prisma generate
      working-directory: backend

    - name: Compile Lambda
      run: npm run build
      working-directory: backend

    - name: Package Lambda code
      run: |
        cd dist
        zip -r ../../lambda-code.zip lambda
      working-directory: backend

    - name: Prepare Lambda layer
      run: |
        rm -rf lambda-layer
        mkdir -p lambda-layer/nodejs
        cd lambda-layer/nodejs

        npm init -y
        npm install @prisma/client

        cd ../../
        zip -r prisma-layer.zip nodejs
      working-directory: backend

    - name: Upload Lambda code to S3
      run: aws s3 cp lambda-code.zip s3://$LAMBDA_S3_BUCKET/lambda-code.zip

    - name: Upload Lambda layer to S3
      run: aws s3 cp backend/lambda-layer/prisma-layer.zip s3://$LAMBDA_S3_BUCKET/prisma-layer.zip

    - name: Publish Lambda layer
      id: publish_layer
      run: |
        LAYER_VERSION=$(aws lambda publish-layer-version \
          --layer-name prisma-layer \
          --content S3Bucket=$LAMBDA_S3_BUCKET,S3Key=prisma-layer.zip \
          --compatible-runtimes nodejs20.x \
          --query Version --output text)
        echo "LAYER_VERSION=$LAYER_VERSION" >> $GITHUB_ENV

    - name: Update Lambdas
      run: |
        for fn in $(aws lambda list-functions \
          --query "Functions[?starts_with(FunctionName, '$PROJECT_NAME')].FunctionName" \
          --output text)
        do
          echo "Updating $fn..."
          aws lambda update-function-code \
            --function-name $fn \
            --s3-bucket $LAMBDA_S3_BUCKET \
            --s3-key lambda-code.zip

          aws lambda wait function-updated --function-name $fn

          aws lambda update-function-configuration \
            --function-name $fn \
            --layers arn:aws:lambda:$AWS_REGION:${{ secrets.AWS_ACCOUNT_ID }}:layer:prisma-layer:${{ env.LAYER_VERSION }}

          aws lambda wait function-updated --function-name $fn
        done