name: Deploy Code Changes

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: eu-west-2
      S3_BUCKET: ${{ secrets.AWS_BUCKET_NAME }}
      CLOUDFRONT_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
      LAMBDA_NAME: ${{ secrets.AWS_LAMBDA_NAME }}

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: eu-west-2

    - name: Install frontend dependencies
      run: npm install

    - name: Build React App
      run: npm run build
      env:
        VITE_ACTIVE_TILE_FILE_LOCATION: /resources/uk_res8_hex_ids.zip
        VITE_ACTIVE_TILE_FILE: uk_res8_hex_ids.txt
        VITE_BACKEND_URL: ${{ secrets.BACKEND_URL }}
        VITE_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_POOL }}
        VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.COGNITO_CLIENT }}

    - name: Deploy frontend to S3
      run: |
        aws s3 sync dist/ s3://$S3_BUCKET --delete --exclude "resources/*" --quiet

    - name: Invalidate CloudFront
      run: |
        aws cloudfront create-invalidation \
          --distribution-id $CLOUDFRONT_ID \
          --paths "/*"

    - name: Install backend dependencies
      run: npm install
      working-directory: ./backend

    - name: Build Lambda
      run: |
        npm ci
        npm run build
        cp dist/*.js .
        zip -r lambda.zip *.js node_modules package.json
      working-directory: backend

    - name: Deploy Lambdas
      run: |
        for fn in $(aws lambda list-functions \
          --query "Functions[?starts_with(FunctionName, '${{ secrets.PROJECT_NAME }}')].FunctionName" \
          --output text)
        do
          aws lambda update-function-code \
            --function-name $fn \
            --zip-file fileb://lambda.zip
        done
      working-directory: backend