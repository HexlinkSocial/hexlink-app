name: Deploy Code Changes

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: eu-west-2
      S3_BUCKET: ${{ secrets.AWS_BUCKET_NAME }}
      CLOUDFRONT_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
      LAMBDA_NAME: ${{ secrets.AWS_LAMBDA_NAME }}

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: eu-west-2

    - name: Install frontend dependencies
      run: npm install

    - name: Build React App
      run: npm run build

    - name: Deploy frontend to S3
      run: |
        aws s3 sync /build/ s3://$S3_BUCKET --delete --quiet

    - name: Invalidate CloudFront
      run: |
        aws cloudfront create-invalidation \
          --distribution-id $CLOUDFRONT_ID \
          --paths "/*"

    - name: Install backend dependencies
      run: npm install
      working-directory: ./backend

    - name: Build Lambda package
      run: |
        zip -r lambda.zip .
      working-directory: ./backend/lambda

    - name: Deploy Lambda
      run: |
        aws lambda update-function-code \
          --function-name $LAMBDA_NAME \
          --zip-file fileb://lambda.zip
      working-directory: ./backend/lambda